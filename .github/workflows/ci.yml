# CI 门禁：云端只守前端构建（vue-tsc 类型检查 + vite build）。
# cargo test 不上云：llm.rs 的 loopback mock 用例依赖「重试开新连接」，在
# 无代理直连的 runner 上被 keep-alive 连接池复用卡死（本地有系统代理掩护，
# 故本地全绿而 CI 挂死）。496 例全绿仍由本地 DoD 保证。见 CHANGELOG [Unreleased]。
# 触发：push 到 main、指向 main 的 PR、手动 workflow_dispatch。
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 前端门禁：vue-tsc 类型检查 + vite 构建（即 package.json 的 pnpm build）
  web:
    name: web (vue-tsc + vite)
    runs-on: windows-latest # 与开发机同平台，避免 Linux/macOS-only 的意外红
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # 仓库未钉 pnpm/node 版本（无 packageManager/.nvmrc），在此处钉：
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
