[package]
name = "huajing"
version = "0.3.1"
description = "化境 — 本地优先的智能体角色扮演客户端（化万千相，随心入境）"
authors = ["huajing"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "huajing_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mlua = { version = "0.12.1", default-features = false, features = ["luajit", "serialize", "vendored"] }
# 必须保留 reqwest 的默认特性：default-tls 提供 HTTPS 传输层（关掉它任何 https 请求都会
# 失败在「error sending request for url」，且错误信息看不出原因）；system-proxy 让请求
# 走系统代理（国内出网的关键）；charset 处理非 UTF-8 响应体。只额外打开 json 与 stream。
reqwest = { version = "0.13.5", features = ["json", "stream"] }
futures-util = "0.3.34"
tokio = { version = "1.53.1", features = ["time", "net"] }
toml = "1.1.6"
notify = "8.2.0"
regex = { version = "1.13.1", default-features = false, features = ["std", "perf", "unicode"] }
# 包格式（M4.1 · 设计 §13）：三包 zip 容器的唯一新依赖；deflate 够用，
# 关默认特性避免带入 bzip2/zstd/aes 等用不上的编解码器
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
